<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholarHub — High School Scholarships, Summer Programs & Research</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173f8a'/%3E%3Cpath d='M32 14L10 24l22 10 18-8.2V38h4V24L32 14z' fill='%23ffffff'/%3E%3Cpath d='M18 31v9c0 4.5 6.3 8 14 8s14-3.5 14-8v-9l-14 6.4L18 31z' fill='%2393c5fd'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f7fb;
      color: #162032;
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 28px 16px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    header h1 { margin: 0 0 6px 0; font-size: 30px; }
    header p { margin: 0; opacity: 0.92; font-size: 15px; }
    .filters-box {
      background: #ffffff;
      border: 1px solid #d7e0ee;
      border-radius: 12px;
      padding: 20px;
      margin: 22px 0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }
    .filter-row { margin-bottom: 14px; }
    .filter-title {
      font-weight: 700;
      display: inline-block;
      min-width: 90px;
      margin-bottom: 6px;
      color: #334155;
    }
    .filter-btn {
      padding: 7px 14px;
      margin: 3px 5px 3px 0;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .filter-btn:hover { border-color: #1d4ed8; color: #1d4ed8; }
    .filter-btn.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .search-bar {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 6px;
    }
    .count-bar {
      margin-top: 12px;
      font-weight: 700;
      color: #1e3a8a;
      font-size: 14px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
      padding-bottom: 48px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d7e0ee;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }
    .tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .type-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .type-scholarship { background: #dcfce7; color: #166534; }
    .type-summer { background: #fef3c7; color: #92400e; }
    .type-research { background: #e0e7ff; color: #3730a3; }
    .grade-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .card h2 { margin: 4px 0 8px 0; font-size: 18px; color: #0f172a; }
    .card p { margin: 0 0 12px 0; color: #475569; font-size: 14px; }
    .details { font-size: 13px; color: #334155; margin-bottom: 16px; }
    .details div { margin-bottom: 5px; }
    .link-btn {
      display: block;
      text-decoration: none;
      background: #1d4ed8;
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
    }
    .link-btn:hover { background: #1e40af; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>ScholarHub</h1>
      <p>Scholarships, summer programs, and research opportunities organized by high school grade level</p>
    </div>
  </header>

  <main class="wrap">
    <div class="filters-box">
      <div class="filter-row" id="gradeGroup">
        <span class="filter-title">Grade:</span>
        <button type="button" class="filter-btn active" data-val="all">All Grades</button>
        <button type="button" class="filter-btn" data-val="9">9th (Freshman)</button>
        <button type="button" class="filter-btn" data-val="10">10th (Sophomore)</button>
        <button type="button" class="filter-btn" data-val="11">11th (Junior)</button>
        <button type="button" class="filter-btn" data-val="12">12th (Senior)</button>
      </div>

      <div class="filter-row" id="typeGroup">
        <span class="filter-title">Category:</span>
        <button type="button" class="filter-btn active" data-val="all">All Categories</button>
        <button type="button" class="filter-btn" data-val="Scholarship">Scholarships</button>
        <button type="button" class="filter-btn" data-val="Summer Program">Summer Programs</button>
        <button type="button" class="filter-btn" data-val="Research">Research</button>
      </div>

      <input type="text" id="searchBox" class="search-bar" placeholder="Search by name, topic, free/paid, or keyword (e.g., STEM, writing, full-ride)..." />
      <div class="count-bar" id="countText">Showing 48 of 48 opportunities</div>
    </div>

    <div class="cards" id="cardsContainer"></div>
  </main>

      { title: "Coca-Cola Scholars Program", type: "Scholarship", grades: [12], award: "$20,000", topic: "Leadership, service, academics", window: "August - October", desc: "Scholarship for high school seniors demonstrating leadership and community impact.", link: "https://www.coca-colascholarsfoundation.org/" },
      { title: "QuestBridge College Prep Scholars Program", type: "Scholarship", grades: [11], award: "Summer awards & college prep", topic: "Low-income high achievers, college prep", window: "March", desc: "Supports high-achieving juniors from low-income backgrounds with college prep awards and resources.", link: "https://www.questbridge.org/high-school-students/college-prep-scholars" },

      { title: "Ross Mathematics Program", type: "Summer Program", grades: [9, 10, 11, 12], award: "6-week math program (aid available)", topic: "Number theory, mathematical proofs", window: "March", desc: "Summer program focused on mathematical discovery and number theory.", link: "https://rossprogram.org/" },
      { title: "PROMYS", type: "Summer Program", grades: [9, 10, 11, 12], award: "6-week BU math program (aid available)", topic: "Number theory, math exploration", window: "March", desc: "Summer math program at Boston University for students ages 14-18.", link: "https://promys.org/" },
      { title: "Girls Who Code Summer Immersion Program", type: "Summer Program", grades: [9, 10, 11], award: "Free virtual program + grants", topic: "Coding, computer science, tech", window: "February - March", desc: "Free virtual coding and tech program for high school girls and non-binary students.", link: "https://girlswhocode.com/programs/summer-immersion-program" },
      { title: "Kode With Klossy Summer Camps", type: "Summer Program", grades: [9, 10, 11, 12], award: "Free 2-week coding camp", topic: "Web dev, apps, AI, data science", window: "March", desc: "Free two-week coding camps for young women and gender-expansive teens.", link: "https://www.kodewithklossy.com/camp" },
      { title: "Princeton Summer Journalism Program", type: "Summer Program", grades: [11], award: "Free journalism program at Princeton", topic: "Journalism, reporting, writing", window: "February", desc: "Free journalism and college prep program for high school juniors.", link: "https://psjp.princeton.edu/" },
      { title: "Carnegie Mellon SAMS", type: "Summer Program", grades: [11], award: "Free 6-week CMU STEM program", topic: "STEM, math, science, projects", window: "March", desc: "Fully funded summer STEM academy at Carnegie Mellon for rising seniors.", link: "https://www.cmu.edu/pre-college/academic-programs/sams.html" },
      { title: "Iowa Young Writers' Studio", type: "Summer Program", grades: [10, 11, 12], award: "2-week writing program (aid available)", topic: "Creative writing, fiction, poetry", window: "January - February", desc: "Creative writing workshops hosted by the University of Iowa.", link: "https://iyws.clas.uiowa.edu/" },
      { title: "NSLI-Y", type: "Summer Program", grades: [9, 10, 11, 12], award: "Full language study scholarship abroad", topic: "World languages, cultural immersion", window: "October - November", desc: "U.S. State Department scholarship program to study critical languages abroad.", link: "https://www.nsliforyouth.org/" },
      { title: "Congress-Bundestag Youth Exchange (CBYX)", type: "Summer Program", grades: [9, 10, 11, 12], award: "Full exchange scholarship in Germany", topic: "German, diplomacy, exchange", window: "November", desc: "Exchange scholarship program for high school students to live and study in Germany.", link: "https://usagermanyscholarship.org/" },

      { title: "Research Science Institute (RSI)", type: "Research", grades: [11], award: "Free 6-week MIT research program", topic: "STEM research, science, engineering", window: "December - January", desc: "Summer science and engineering research program hosted at MIT.", link: "https://www.cee.org/programs/research-science-institute" },
      { title: "Stanford SIMR", type: "Research", grades: [11, 12], award: "8-week biomedical research internship", topic: "Medicine, biology, lab research", window: "February", desc: "Biomedical research internship at Stanford for students age 16+.", link: "https://simr.stanford.edu/" },
      { title: "NASA High School Internship (OSTEM)", type: "Research", grades: [10, 11, 12], award: "Paid NASA internship", topic: "Space, engineering, earth science", window: "Fall, Spring, Summer cycles", desc: "Hands-on STEM and research internships at NASA for students age 16+.", link: "https://stem.nasa.gov/ostem/" },
      { title: "Navy SEAP", type: "Research", grades: [10, 11, 12], award: "Paid 8-week Navy lab placement", topic: "Engineering, science, Navy research", window: "Fall - Early Winter", desc: "Paid summer research apprenticeship in Department of the Navy labs for ages 16+.", link: "https://www.navalsteminterns.us/seap/" },
      { title: "Regeneron Science Talent Search", type: "Research", grades: [12], award: "Up to $250,000", topic: "Independent science & math research", window: "November of senior year", desc: "Science and math research competition based on original student research.", link: "https://www.societyforscience.org/regeneron-sts/" },
      { title: "Simons Summer Research Program", type: "Research", grades: [11], award: "Research fellowship + stipend", topic: "Science, math, engineering research", window: "February", desc: "Mentored summer research program at Stony Brook University for juniors.", link: "https://www.stonybrook.edu/simons/" },
      { title: "Summer Science Program (SSP)", type: "Research", grades: [10, 11], award: "5-week research program (aid available)", topic: "Astrophysics, biochemistry, genomics", window: "February - March", desc: "Team research program in astrophysics, biochemistry, or genomics.", link: "https://summerscience.org/" },
      { title: "Garcia Summer Research Program", type: "Research", grades: [10, 11, 12], award: "7-week materials science lab program", topic: "Chemistry, physics, materials science", window: "February", desc: "Hands-on materials science and polymer research program at Stony Brook.", link: "https://www.stonybrook.edu/commcms/garcia/summer_program/program_description" },
      { title: "NIH High School Summer Internship (HS-SIP)", type: "Research", grades: [11, 12], award: "Paid 8-week NIH internship", topic: "Biomedical & clinical research", window: "February", desc: "Paid summer biomedical research at the National Institutes of Health for ages 17+.", link: "https://www.training.nih.gov/research-training/hs/hs-sip/" },
      { title: "MIT Beaver Works Summer Institute", type: "Research", grades: [9, 10, 11], award: "Free 4-week STEM engineering program", topic: "Robotics, AI, cybersecurity, aerospace", window: "February - March", desc: "Project-based engineering and research program with online prerequisites.", link: "https://bwsi.mit.edu/" },
      { title: "Clark Scholars Program", type: "Research", grades: [11, 12], award: "Free 7-week program + $750 stipend", topic: "Sciences, humanities, social sciences", window: "February", desc: "Summer research program at Texas Tech University for students age 17+.", link: "https://www.depts.ttu.edu/honors/academicsandenrichment/affiliatedandhighschool/clarks/" },
      { title: "Hutton Junior Fisheries Biology Program", type: "Research", grades: [11, 12], award: "Paid 8-week internship ($3,000)", topic: "Ecology, marine & freshwater biology", window: "January - February", desc: "Paid summer field research internship in fisheries and aquatic science.", link: "https://hutton.fisheries.org/" },
      { title: "AEOP High School Apprenticeship", type: "Research", grades: [9, 10, 11, 12], award: "Paid STEM lab apprenticeship", topic: "Engineering, biology, computer science", window: "Rolling / Spring", desc: "Paid STEM research apprenticeships at university and DoD laboratories.", link: "https://www.usaeop.com/program/high-school-apprenticeships/" },
      { title: "Junior Science and Humanities Symposium", type: "Research", grades: [9, 10, 11, 12], award: "Scholarships up to $12,000", topic: "STEM research presentation", window: "Fall - Winter", desc: "Symposium and competition for students presenting original STEM research.", link: "https://www.jshs.org/" },
      { title: "UCSB Research Mentorship Program", type: "Research", grades: [10, 11], award: "6-week research program (aid available)", topic: "STEM, humanities, social sciences", window: "March", desc: "Mentored university research program for 10th and 11th grade students.", link: "https://www.summer.ucsb.edu/programs/research-mentorship-program/overview" }
    ];

    var activeGrade = "all";
    var activeType = "all";
    var searchText = "";

    function getBadgeClass(type) {
      if (type === "Scholarship") return "type-scholarship";
      if (type === "Summer Program") return "type-summer";
      return "type-research";
    }

    function renderCards() {
      var container = document.getElementById("cardsContainer");
      var countEl = document.getElementById("countText");
      var query = searchText.trim().toLowerCase();

      var filtered = ALL_ITEMS.filter(function (item) {
        var matchesGrade = activeGrade === "all" || item.grades.indexOf(Number(activeGrade)) !== -1;
        var matchesType = activeType === "all" || item.type === activeType;
        var matchesQuery =
          query === "" ||
          item.title.toLowerCase().indexOf(query) !== -1 ||
          item.type.toLowerCase().indexOf(query) !== -1 ||
          item.topic.toLowerCase().indexOf(query) !== -1 ||
          item.award.toLowerCase().indexOf(query) !== -1 ||
          item.desc.toLowerCase().indexOf(query) !== -1;
        return matchesGrade && matchesType && matchesQuery;
      });

      countEl.textContent = "Showing " + filtered.length + " of " + ALL_ITEMS.length + " opportunities";

      if (filtered.length === 0) {
        container.innerHTML = "<div class='card'><h2>No opportunities match</h2><p>Try selecting All Grades, All Categories, or clearing your search.</p></div>";
        return;
      }

      var html = "";
      for (var i = 0; i < filtered.length; i++) {
        var item = filtered[i];
        var gradeLabel = "Grades: " + item.grades.join(", ");
        html +=
          "<div class='card'>" +
            "<div>" +
              "<div class='tag-row'>" +
                "<span class='type-tag " + getBadgeClass(item.type) + "'>" + item.type + "</span>" +
                "<span class='grade-tag'>" + gradeLabel + "</span>" +
              "</div>" +
              "<h2>" + item.title + "</h2>" +
              "<p>" + item.desc + "</p>" +
              "<div class='details'>" +
                "<div><strong>Award / Program:</strong> " + item.award + "</div>" +
                "<div><strong>Focus:</strong> " + item.topic + "</div>" +
                "<div><strong>Typical Window:</strong> " + item.window + "</div>" +
              "</div>" +
            "</div>" +
            "<a class='link-btn' href='" + item.link + "' target='_blank' rel='noopener noreferrer'>Visit Official Page</a>" +
          "</div>";
      }
      container.innerHTML = html;
    }

    function setupGroup(groupId, onSelect) {
      var buttons = document.querySelectorAll("#" + groupId + " .filter-btn");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", function () {
          for (var j = 0; j < buttons.length; j++) {
            buttons[j].classList.remove("active");
          }
          this.classList.add("active");
          onSelect(this.getAttribute("data-val"));
          renderCards();
        });
      }
    }

    setupGroup("gradeGroup", function (val) { activeGrade = val; });
    setupGroup("typeGroup", function (val) { activeType = val; });
    document.getElementById("searchBox").addEventListener("input", function () {
      searchText = this.value;
      renderCards();
    });

    renderCards();
  </script>
</body>
</html>
