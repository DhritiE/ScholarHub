name: Auto-Update ScholarHub Opportunities

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run opportunity fetcher
        run: python fetch_opportunities.py

      - name: Commit updated JSON if new opportunities were added
        run: |
          git config user.name "ScholarHub Bot"
          git config user.email "bot@users.noreply.github.com"
          git add scholarhub-opportunities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update opportunities" && git push)
